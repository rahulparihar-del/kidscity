    <script>

      function gtag(){dataLayer.push(arguments);}

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="alternate" hreflang="en" href="%VITE_SITE_URL%/" />
    <link rel="alternate" hreflang="x-default" href="%VITE_SITE_URL%/" />

    <!-- Primary SEO -->
    <title>Kids City | Kids Clothes Shop in Wakad, Pune</title>
    <meta
      name="description"
      content="Kids City is a children clothing store in Wakad, Pune. Shop cotton night suits, birthday dresses & festive wear for ages 0–15. 4.9★ on Google."
    />
    <meta
      name="keywords"
      content="kids clothes Pune, kids clothing store Pune, baby clothes shop Pune, kids wear Pune, buy kids clothes online Pune, kids clothes home delivery Pune, kids clothes shop Wakad, kids party wear Pune, birthday dress for girls Pune, kids ethnic wear Pune, kids night suit Pune, baby clothes shop Pune, kids clothes Hinjewadi, kids clothes Baner"
    />

    <meta name="author" content="Kids City, Pune" />
    <meta name="theme-color" content="#3D405B" />
    <meta name="color-scheme" content="light" />

    <!-- Language & Content Type -->
    <meta http-equiv="content-language" content="en-IN" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <meta name="rating" content="general" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="IN-MH" />
    <meta name="geo.placename" content="Wakad, Pune, Maharashtra, India" />

    <!-- Open Graph (Facebook / WhatsApp / Meta) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kids City" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Kids City | Kids Clothes Shop in Wakad, Pune" />
    <meta
      property="og:description"
      content="Kids City is a children clothing store in Wakad, Pune. Shop cotton night suits, birthday dresses & festive wear for ages 0–15. 4.9★ on Google."

    <meta property="og:url" content="%VITE_SITE_URL%/" />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kids City | Kids Clothes Shop in Wakad, Pune" />

      name="twitter:description"
      content="Kids City is a children clothing store in Wakad, Pune. Shop cotton night suits, birthday dresses & festive wear for ages 0–15. 4.9★ on Google."

    <!-- ================================================================
         Structured Data Block 1: ClothingStore (LocalBusiness)
         ================================================================ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ClothingStore",
        "@id": "%VITE_SITE_URL%/#store",
        "name": "Kids City",
        "url": "%VITE_SITE_URL%/",
        "logo": {
          "@type": "ImageObject",
          "url": "%VITE_SITE_URL%/images/logo_full.webp",
          "width": 512,
          "height": 200
        },
        "image": [
          "%VITE_SITE_URL%/images/og-kids-city.jpg",
          "%VITE_SITE_URL%/images/founder-kids-city-wakad.jpg",
          "%VITE_SITE_URL%/images/festival_wear.webp",
          "%VITE_SITE_URL%/images/birthday_dress.webp"
        ],
        "description": "Kids City is a children clothing store located in the neighbourhood of Wakad, Pune, established in 2018. We specialize in festive wear including Navratri lehengas and Diwali kurtas, birthday party dresses, cotton night suits, and everyday outfits for boys and girls aged 0 to 15 years.",
        "telephone": "+91-78916-72762",
        "email": "kidscitywakad@gmail.com",
        "priceRange": "$$",
        "currenciesAccepted": "INR",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Shop No 12, Mahalaxmi Complex, Chatrapati Chowk Road",
          "addressLocality": "Pune",
          "addressRegion": "Maharashtra",
          "postalCode": "411057",
          "addressCountry": "IN"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": null,
          "longitude": null
        },
        "hasMap": "https://www.google.com/maps/dir//Kids+City+Wakad",
        "areaServed": [
          {"@type": "City", "name": "Pune"},
          {"@type": "City", "name": "Pimpri-Chinchwad"},
          {"@type": "AdministrativeArea", "name": "Wakad"}
        ],
        "sameAs": [
          "https://instagram.com/kidscity____",
          "https://www.google.com/maps/dir//Kids+City+Wakad"
        ],
        "foundingDate": "2018",
        "slogan": "Clothes for Little Explorers"
      }
    </script>

    <!-- Structured Data Block 2: WebSite with SearchAction (Google Sitelinks Searchbox) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "%VITE_SITE_URL%/#website",
        "url": "%VITE_SITE_URL%/",
        "name": "Kids City",
        "description": "Kids clothes shop in Wakad, Pune — festival wear, birthday dresses, traditional outfits, and casual wear for boys & girls aged 0–15 years.",
        "publisher": {"@id": "%VITE_SITE_URL%/#organization"},
        "inLanguage": "en-IN",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "%VITE_SITE_URL%/collections?s={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Structured Data Block 3: BreadcrumbList for key pages -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "%VITE_SITE_URL%/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Kids Clothing Collections",

          },
          {

          {
            "@type": "ListItem",

            "name": "Contact",
            "item": "%VITE_SITE_URL%/contact"
          }
        ]
      }
    </script>

    <!-- Structured Data Block 4: FAQPage Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Where is Kids City located in Wakad, Pune?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Kids City is located at Shop No 12, Mahalaxmi Complex, Chatrapati Chowk Road, Wakad, Pune, Maharashtra 411057."
            }
          },
          {

              "text": "Kids City Wakad is open every day. Please message or call on WhatsApp (+91 78916 72762) to confirm today's hours."
            }
          },
          {
            "@type": "Question",
            "name": "What type of kids clothing does Kids City stock?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Kids City stocks festival wear (Navratri lehengas, Diwali kurtas), birthday party dresses, traditional ethnic outfits, casual daily wear, and night suits for boys and girls aged 0–15 years."
            }
          },
          {
            "@type": "Question",
            "name": "Does Kids City serve Hinjewadi, Baner, and other areas near Wakad?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes! Kids City serves families from Wakad, Hinjewadi, Baner, Balewadi, Pimple Saudagar, Ravet, Tathawade, Pimpri, Chinchwad, and across Pune."
            }
          },
          {
            "@type": "Question",
            "name": "Can I WhatsApp Kids City before visiting the store?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes! WhatsApp us at +91 78916 72762 to check stock, available sizes, and current collections before your visit. Our team responds quickly."
            }
          }
        ]
      }
