    <!-- ================================================================
         Sitewide structured data (route-invariant): a single @graph with
         the Organization/LocalBusiness/ClothingStore and the WebSite.
         Kept static in the shell so it is present in the raw HTML for every
         crawler. Page-specific entities (WebPage, Product, CollectionPage,
         BreadcrumbList, FAQPage) are injected per route by the app.
         NOTE: aggregateRating is intentionally omitted — it must not be
         emitted until a live, verifiable Google rating/review count is
         supplied. See src/lib/seo.js and FAQView.jsx for per-route JSON-LD.
         ================================================================ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": ["ClothingStore", "LocalBusiness"],
            "@id": "%VITE_SITE_URL%/#organization",
            "name": "Kids City",
            "alternateName": ["Kids City Wakad", "Kids City Pune"],
            "url": "%VITE_SITE_URL%/",

              "contentUrl": "%VITE_SITE_URL%/images/logo_full.webp",
              "width": 1200,
              "height": 630,
              "caption": "Kids City — Best Kids Clothes Shop in Wakad, Pune"
            },
            "image": { "@id": "%VITE_SITE_URL%/#logo" },
            "description": "Kids City is a kids' clothing store in Wakad, Pune offering skin-safe baby wear, kids night suits, festival and ethnic wear including Navratri lehengas and Diwali kurtas, birthday dresses, and casual wear for children aged 0–14 years, with cash on delivery and easy in-store size exchanges.",

              "addressLocality": "Wakad",
              "addressRegion": "Maharashtra",
              "postalCode": "411057",

            "geo": {

            },

              { "@type": "City", "name": "Hinjewadi" },
